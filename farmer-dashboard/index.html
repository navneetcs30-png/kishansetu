    <script>
      // Defensive polyfill: Ensure window.fetch has both getter and setter in iframe environments
      (function () {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _fetch;
            },
            set: function (val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true,
          });

          // Intercept future defineProperty on window.fetch that omit a setter
          var origDefineProperty = Object.defineProperty;
          Object.defineProperty = function (target, prop, desc) {
            if ((target === window || (typeof Window !== 'undefined' && target === Window.prototype)) && prop === 'fetch') {
              if (desc && typeof desc.get === 'function' && typeof desc.set !== 'function') {
                var customVal;
                var origGet = desc.get;
                desc.set = function (newVal) {
                  customVal = newVal;
                };
                desc.get = function () {
                  return customVal !== undefined ? customVal : origGet.call(this);
                };
                desc.configurable = true;
              }
            }
            return origDefineProperty.call(Object, target, prop, desc);
          };
        } catch (e) {
          console.warn('Window fetch descriptor initialization notice:', e);
        }
      })();
    </script>
