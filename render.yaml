services:
  - type: web
    name: kishansetu
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        value: https://zbwpvedsulwjzbejynqa.supabase.co
      - key: GEMINI_API_KEY
        sync: false
